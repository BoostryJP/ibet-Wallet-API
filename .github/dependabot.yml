version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:00"
    allow:
      - dependency-name: "*"
        dependency-type: "direct"
    cooldown:
      default-days: 14
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "*"
        dependency-type: "direct"
    cooldown:
      default-days: 14
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/tests"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      all-dependencies:
        patterns:
          - "*"
        group-by: dependency-name

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      all-dependencies:
        patterns:
          - "*"
